<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dispatch Queue — Mockup (SCR-101)</title>
<style>
.screen--dispatch-queue { font-family: system-ui, sans-serif; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
.record-list { width: 100%; border-collapse: collapse; }
.record-list th, .record-list td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #eee; }
.record-list__row--selected { background: #eff6ff; }
.detail-form { display: grid; grid-template-columns: 160px 1fr; gap: 0.5rem 1rem; padding: 1rem 0; }
.btn { padding: 0.4rem 0.9rem; border: 1px solid #ccc; background: #f8f8f8; border-radius: 4px; cursor: pointer; font-size: 0.85rem; text-decoration: none; color: #333; display: inline-block; }
.btn--primary { background: #2563eb; color: white; border-color: #2563eb; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.screen__footer { display: flex; gap: 0.5rem; padding-top: 0.75rem; border-top: 1px solid #eee; align-items: center; }
#assign-confirmation { color: #16a34a; font-size: 0.85rem; display: none; }
</style>
</head>
<body>
<div class="screen screen--dispatch-queue">
  <header class="screen__header"><h1>Dispatch Queue</h1></header>
  <section class="screen__list-section">
    <table class="record-list">
      <thead><tr><th>Request</th><th>Status</th><th>Assigned Technician</th></tr></thead>
      <tbody>
        <tr class="record-list__row record-list__row--selected">
          <td>Equipment Rental — 2378</td><td>Unscheduled</td><td id="assigned-technician-cell">—</td>
        </tr>
      </tbody>
    </table>
  </section>
  <section class="screen__detail-section">
    <dl class="detail-form">
      <dt>Technician</dt>
      <dd>
        <select id="technician-select">
          <option value="" selected>(choose a technician)</option>
          <option value="J. Alvarez">J. Alvarez — available</option>
        </select>
      </dd>
      <dt>Time Slot</dt>
      <dd><input type="text" id="time-slot-input" placeholder="e.g. Tomorrow 9am-12pm"></dd>
    </dl>
  </section>
  <footer class="screen__footer">
    <button class="btn btn--primary" id="assign-btn" data-action="assign" disabled>Assign</button>
    <span id="assign-confirmation">✓ Assigned</span>
    <a class="btn" id="to-job-status-link" href="../SCR-102/mockup.html" data-transition-target="SCR-102">Open Job Status Update →</a>
  </footer>
</div>
<script>
  const techSelect = document.getElementById('technician-select');
  const timeInput = document.getElementById('time-slot-input');
  const assignBtn = document.getElementById('assign-btn');
  const assignedCell = document.getElementById('assigned-technician-cell');
  const confirmSpan = document.getElementById('assign-confirmation');

  function validate() {
    assignBtn.disabled = !(techSelect.value && timeInput.value.trim());
  }
  techSelect.addEventListener('change', validate);
  timeInput.addEventListener('input', validate);

  assignBtn.addEventListener('click', () => {
    assignedCell.textContent = techSelect.value + ' @ ' + timeInput.value;
    confirmSpan.style.display = 'inline';
  });
</script>
</body>
</html>
